name: Deploy a GitHub Pages

# Publica el juego (sitio estático en la raíz) en GitHub Pages.
on:
  push:
    branches: ["claude/3d-block-game-clone-q2hjqk"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages (se auto-habilita)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
